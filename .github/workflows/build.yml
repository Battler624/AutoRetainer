name: Build AutoRetainer

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Download Dalamud (staging)
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath C:\dalamud -Force
          # Also extract to the AppData path that hardcoded csproj references expect
          $devPath = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $devPath
          Expand-Archive -Path dalamud.zip -DestinationPath $devPath -Force
        shell: powershell

      - name: Restore dependencies
        run: dotnet restore AutoRetainer.sln /p:DalamudLibPath=C:\dalamud

      - name: Build (Release)
        run: dotnet build AutoRetainer.sln --configuration Release --no-restore /p:DalamudLibPath=C:\dalamud

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoRetainer
          path: |
            AutoRetainer/bin/Release/**/AutoRetainer.dll
          if-no-files-found: error
